<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SmartNotes AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand" style="justify-content: center; margin-bottom: 0.5rem;">
                    <div class="brand-icon">⚡</div>
                    <span class="brand-text">SmartNotes AI</span>
                </div>
                <h2>Create Your Account</h2>
                <p>Convert academic PDFs into mastery notes, quizzes & spaced study plans</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="displayName">Your Full Name</label>
                    <input type="text" id="displayName" class="form-input" placeholder="Alex Morgan" required autocomplete="name" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="student@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password" />
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;" id="registerSubmitBtn">
                    Create Free Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
</body>
</html>
